name: ci
on: [push, pull_request]
env:
  # The root `prepare` script installs the Git hook dispatcher. There is nothing
  # to commit from CI, so skip it.
  VP_GIT_HOOKS: 0

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Setup Vite+ ⚡️
        # Replaces pnpm/action-setup and actions/setup-node. The vp version comes
        # from the `vite-plus` catalog entry in pnpm-workspace.yaml, so it stays in
        # step with local development without being repeated here.
        uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            args: [--frozen-lockfile]

      - name: Cache Vite Task results 💾
        # setup-vp's cache only covers package-manager data, so the task cache
        # that makes `vp run` skip unchanged work needs its own entry.
        uses: actions/cache@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ github.sha }}
          restore-keys: vite-task-${{ runner.os }}-

      - run: vp toolchain

      - name: Build
        # run: pnpm run build
        # Public peer server is down for the moment -> we use a local signaling server
        run: pnpm run build:peer-server

      - name: Check (format, lint, types)
        run: vp check

      # `vp check` type checks through tsgolint, which only reads `.ts` and
      # `.tsx`. The single file components of the vue demo need vue-tsc.
      - name: Check (vue single file components)
        run: pnpm run typecheck:vue

      - name: Unit tests
        run: pnpm run test

      # Playwright's browsers are not fetched by `pnpm install` - the postinstall
      # hook is not in `allowBuilds` - so they are downloaded here, explicitly.
      # `--with-deps` also installs the shared libraries Chromium needs on a
      # bare ubuntu runner.
      - name: Install Playwright's Chromium 🎭
        run: pnpm run test:e2e:install --with-deps

      - name: End2end tests
        # `pnpm run test:e2e` builds the demo against the local signaling server
        # and starts both that server and the preview server itself, so there is
        # no start-server-and-test wrapper and no timeout to tune here any more.
        run: pnpm run test:e2e

      - name: Upload Playwright report 📤
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            demo/playwright-report
            demo/test-results
          retention-days: 7
          if-no-files-found: ignore
