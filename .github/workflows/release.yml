name: release

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Each job declares what it needs; nothing is granted by default.
permissions: {}

env:
  # The root `prepare` script installs the Git hook dispatcher. The version job
  # commits through changesets/action, whose "Version Packages" subject is not a
  # Conventional Commit, so the commit-msg hook must not be in the way here.
  VP_GIT_HOOKS: 0

jobs:
  select-mode:
    name: Select mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    permissions:
      contents: read
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Vite+ ⚡️
        uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            args: [--frozen-lockfile]

      - name: Select mode
        id: select-mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    name: Version
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to push the version commit
      pull-requests: write # to open the "Version Packages" pull request
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Vite+ ⚡️
        uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            args: [--frozen-lockfile]

      - name: Create or update the version pull request 🔖
        uses: changesets/action/version@v2.1.2
        with:
          script: pnpm run changeset:version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          # @changesets/changelog-github reads this to resolve pull requests and authors
          GITHUB_TOKEN: ${{ github.token }}

  publish:
    name: Publish
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # to push git tags and create GitHub releases
      id-token: write # to mint the OIDC token npm trusted publishing exchanges for credentials
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Vite+ ⚡️
        uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            args: [--frozen-lockfile]

      - name: Debug OIDC token claims 🔍
        run: |
          RESP=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org")
          node -e '
            const { value: token } = JSON.parse(process.argv[1]);
            const payload = JSON.parse(Buffer.from(token.split(".")[1], "base64url").toString());
            const keys = ["repository","repository_owner","workflow_ref","job_workflow_ref","environment","ref","ref_type","sub","event_name","actor","repository_visibility"];
            for (const k of keys) console.log(k + ":", payload[k]);
          ' "$RESP"

      - name: Publish to npm 🚀
        uses: changesets/action/publish@v2.1.2
        with:
          script: pnpm run release
