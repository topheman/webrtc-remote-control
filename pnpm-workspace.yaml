packages:
  - "packages/*"
  - "demo"

# Dependencies declared by more than one workspace package. The catalog keeps
# each one pinned to a single version in one place.
#
# Test files across every package import from "vitest", so each one declares it.
# Vite and its plugins are shared by the demo (which builds with them) and the
# root Vitest config (which reuses the React plugin to transform JSX in tests).
# React is shared by `packages/react` (which develops and tests against it) and
# the demo (which ships it); the range is `~19.2` rather than `^19` on purpose,
# because `@react-three/fiber` declares `react: ">=19 <19.3"` and the demo's 3D
# page depends on it. Widen it once fiber does.
#
# `packages/react`'s `peerDependencies.react` is not catalogued: `>=16.8.0` is
# the public contract, the widest React the package supports, and it has no
# business tracking the version the repo happens to develop against.
catalog:
  vitest: 4.1.11
  react: ~19.2
  react-dom: ~19.2
  "@types/react": ~19.2
  "@types/react-dom": ~19.2
  "@testing-library/react": ^16.3.3
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  "@vitejs/plugin-react": ^6.1.1
  "@vitejs/plugin-vue": ^6.0.8
  start-server-and-test: ^3.0.12
  vite-plus: 0.3.1

# Postinstall scripts pnpm runs. esbuild fetches binaries, vue-demi picks the
# Vue 2/3 shim, protobufjs runs a codegen check. Playwright is deliberately not
# here: its browsers are fetched by an explicit `pnpm run test:e2e:install`, so
# a plain install stays quick and the download is visible rather than implied.
allowBuilds:
  esbuild: true
  protobufjs: true
  vue-demi: true
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
